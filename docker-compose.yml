
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: django-backend

    environment:
      DEBUG: "False"
      ALLOWED_HOSTS: "localhost,127.0.0.1,backend"

    volumes:
      - django_data:/app/data

    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: react-frontend

    ports:
      - "80:80"

    depends_on:
      - backend

volumes:
  django_data:
