name: Django React CI/CD - Build and Push to ECR

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Configure AWS credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      # 3. Login to ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Build backend locally
      - name: Build Backend Image
        run: |
          docker build \
            -t ecr-task01:latest \
            -f Dockerfile .

      # 5. Build frontend locally
      - name: Build Frontend Image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --load \
            -t ecr-task-frontend:latest \
            -f frontend/Dockerfile frontend

      # 6. Delete previous images from ECR
      - name: Delete Old ECR Images
        env:
          AWS_REGION: ap-southeast-2
        run: |
          for REPOSITORY in ecr-task01 ecr-task-frontend
          do
            echo "Deleting old images from $REPOSITORY"

            aws ecr list-images \
              --repository-name "$REPOSITORY" \
              --region "$AWS_REGION" \
              --filter tagStatus=ANY \
              --query 'imageIds' \
              --output json > image-ids.json

            mapfile -t IMAGE_IDS < <(
              jq -r '.[] |
                if has("imageTag")
                then "imageTag=" + .imageTag
                else "imageDigest=" + .imageDigest
                end' image-ids.json
            )

            for ((i=0; i<${#IMAGE_IDS[@]}; i+=100))
            do
              aws ecr batch-delete-image \
                --repository-name "$REPOSITORY" \
                --region "$AWS_REGION" \
                --image-ids "${IMAGE_IDS[@]:i:100}"
            done

            echo "Old images deleted from $REPOSITORY"
          done

      # 7. Push backend image
      - name: Push Backend Image
        run: |
          docker tag \
            ecr-task01:latest \
            966499104819.dkr.ecr.ap-southeast-2.amazonaws.com/ecr-task01:latest

          docker push \
            966499104819.dkr.ecr.ap-southeast-2.amazonaws.com/ecr-task01:latest

      # 8. Push frontend image
      - name: Push Frontend Image
        run: |
          docker tag \
            ecr-task-frontend:latest \
            966499104819.dkr.ecr.ap-southeast-2.amazonaws.com/ecr-task-frontend:latest

          docker push \
            966499104819.dkr.ecr.ap-southeast-2.amazonaws.com/ecr-task-frontend:latest

      # 9. Verify ECR images
      - name: Verify Images in ECR
        run: |
          aws ecr describe-images \
            --repository-name ecr-task01 \
            --region ap-southeast-2

          aws ecr describe-images \
            --repository-name ecr-task-frontend \
            --region ap-southeast-2

      # 10. Success
      - name: Pipeline Success
        run: |
          echo "Both Docker images successfully pushed!"
          echo "Backend: ecr-task01:latest"
          echo "Frontend: ecr-task-frontend:latest"

